{% extends 'core/base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0" style="border-radius: 20px; overflow: hidden;">
                <div class="card-body p-4 p-md-5">
                    <h3 class="fw-bold text-center mb-4">Fund Your Account</h3>

                    <!-- 💳 Payment Methods Section -->
                    <div class="mb-4">
                        <p class="text-muted small fw-bold text-uppercase mb-3">Choose a payment method:</p>

                        <!-- Crypto Option -->
                        <div class="p-3 mb-3 border rounded-3 bg-light">
                            <div class="d-flex align-items-center mb-2">
                                <i class="bi bi-currency-bitcoin text-warning fs-4 me-2"></i>
                                <span class="fw-bold">Bitcoin (BTC) Address</span>
                            </div>
                            <code
                                class="d-block p-2 bg-white border rounded text-break">bc1q65xmpry2tjxqzkshhr9w83kc0yzv89up7hk974</code>
                        </div>
                    </div>

                    <hr class="my-4">

                    <!-- Form Section -->
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">Amount to Deposit ($)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white">$</span>
                                <input type="number" name="amount" class="form-control" placeholder="0.00" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Upload Proof of Payment</label>
                            <input type="file" name="proof" class="form-control" accept="image/*" required>
                            <div class="form-text">Please upload a clear screenshot of your receipt.</div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-3 fw-bold shadow-sm rounded-pill">
                            Submit Deposit Proof
                        </button>
                    </form>
                </div>
            </div>
            <p class="text-center text-muted mt-4 small">
                <i class="bi bi-shield-lock-fill me-1"></i> Your transaction is secured and encrypted.
            </p>
        </div>
    </div>
</div>

<style>
    body {
        background-color: #f4f7f6;
    }

    .card {
        transition: transform 0.3s ease;
    }

    .btn-primary {
        background: linear-gradient(45deg, #0d6efd, #0046af);
        border: none;
    }

    .btn-primary:hover {
        background: linear-gradient(45deg, #0046af, #0d6efd);
        transform: scale(1.02);
    }
</style>
{% endblock %}
